<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vespera-works — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }

  body {
    font-family: 'Manrope', sans-serif;
    background: #F8FAFC;
    color: #0F172A;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #liquidCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  /* Soft Ambient Noise Grain */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
    opacity: 0.4;
  }

  .stage {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0 20px;
    animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 5px;
    color: #64748B;
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 600;
  }

  .name {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(3.2rem, 7.5vw, 6rem);
    font-weight: 800;
    line-height: 1.05;
    color: #0F172A;
    letter-spacing: -0.5px;
    margin-bottom: 10px;
    text-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
  }

  .sub {
    font-size: clamp(0.88rem, 2vw, 1.02rem);
    color: #475569;
    letter-spacing: 0.4px;
    margin-bottom: 48px;
    font-weight: 600;
  }

  /* ── SLEEK LIGHT GLASS CARDS ── */
  .choices {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }

  .choice {
    position: relative;
    text-decoration: none;
    width: 310px;
    padding: 24px 28px 22px 28px;
    border-radius: 28px 48px 28px 28px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.88) 0%, rgba(241, 245, 249, 0.72) 100%);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1.5px solid rgba(226, 232, 240, 0.9);
    border-top: 2px solid rgba(255, 255, 255, 1);
    box-shadow:
      0 20px 45px -10px rgba(15, 23, 42, 0.08),
      inset 0 1.5px 0 rgba(255, 255, 255, 0.9),
      inset 0 -1.5px 0 rgba(203, 213, 225, 0.3);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease, border-color 0.4s ease;
  }

  .choice.animated {
    border-radius: 48px 28px 28px 28px;
    align-items: flex-end;
  }

  .choice:hover {
    transform: translateY(-8px) scale(1.02);
    border-color: rgba(148, 163, 184, 0.5);
    box-shadow:
      0 30px 60px -12px rgba(15, 23, 42, 0.15),
      inset 0 1.5px 0 rgba(255, 255, 255, 1);
  }

  .choice-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
  }

  .choice.minimal .choice-inner { text-align: left; }
  .choice.animated .choice-inner { text-align: right; }

  .choice-icon {
    font-size: 1.6rem;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    color: #0284C7;
  }
  .choice.animated .choice-icon { justify-content: flex-end; color: #DB2777; }

  .choice-label {
    font-family: 'Baloo 2', cursive;
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #0F172A;
  }

  .choice-desc {
    font-size: 0.85rem;
    font-weight: 600;
    color: #475569;
    letter-spacing: 0.3px;
  }

  /* ── 3D SHINY GEM SPHERES ── */
  .gem-sphere {
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    z-index: 2;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.15);
  }

  .choice.minimal .gem-sphere {
    top: 22px;
    right: 22px;
    background: radial-gradient(circle at 35% 35%, #34D399, #059669 55%, #047857 100%);
    box-shadow: 0 4px 16px rgba(5, 150, 105, 0.4), inset 0 2px 4px rgba(255,255,255,0.7);
    animation: gemPulseGreen 4s ease-in-out infinite alternate;
  }

  .choice.animated .gem-sphere {
    top: 22px;
    left: 22px;
    background: radial-gradient(circle at 35% 35%, #F472B6, #DB2777 55%, #9D174D 100%);
    box-shadow: 0 4px 16px rgba(219, 39, 119, 0.4), inset 0 2px 4px rgba(255,255,255,0.7);
    animation: gemPulsePink 4s ease-in-out infinite alternate;
  }

  @keyframes gemPulseGreen {
    0% { transform: scale(1); box-shadow: 0 4px 16px rgba(5, 150, 105, 0.4), inset 0 2px 4px rgba(255,255,255,0.7); }
    100% { transform: scale(1.15); box-shadow: 0 6px 22px rgba(52, 211, 153, 0.7), inset 0 2px 5px rgba(255,255,255,0.9); }
  }

  @keyframes gemPulsePink {
    0% { transform: scale(1); box-shadow: 0 4px 16px rgba(219, 39, 119, 0.4), inset 0 2px 4px rgba(255,255,255,0.7); }
    100% { transform: scale(1.15); box-shadow: 0 6px 22px rgba(244, 114, 182, 0.7), inset 0 2px 5px rgba(255,255,255,0.9); }
  }

  /* Specular highlight on gem */
  .gem-sphere::after {
    content: '';
    position: absolute;
    top: 4px;
    left: 5px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.9);
    filter: blur(0.5px);
  }

  /* ── FOOTER SOCIAL ICONS ── */
  .footer-socials {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 10;
  }

  .social-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(203, 213, 225, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #334155;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
  }

  .social-icon:hover {
    transform: translateY(-4px) scale(1.1);
    background: #ffffff;
    border-color: #94A3B8;
    color: #0F172A;
    box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
  }

  /* Mobile Responsive */
  @media (max-width: 680px) {
    .choices { flex-direction: column; align-items: center; gap: 18px; }
    .choice { width: 88vw; max-width: 320px; border-radius: 28px !important; align-items: flex-start !important; }
    .choice .choice-inner { text-align: left !important; }
    .choice .choice-icon { justify-content: flex-start !important; }
    .choice.animated .gem-sphere { top: 22px; right: 22px; left: auto; }
    .name { font-size: clamp(2.4rem, 10vw, 3.8rem); }
  }
</style>

<script>
  const canvas = document.getElementById('liquidCanvas');
  const ctx = canvas.getContext('2d');

  let W, H;
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Soft Luminous Pastel Light Theme Palette
  const blobs = [
    { x: 0.22, y: 0.35, r: 0.44, speed: 1.1,  color: '#38BDF8', phase: 0   }, // Light Sky Blue
    { x: 0.78, y: 0.60, r: 0.46, speed: 0.85, color: '#F472B6', phase: 1.2 }, // Soft Rose Pink
    { x: 0.48, y: 0.15, r: 0.36, speed: 1.2,  color: '#818CF8', phase: 2.4 }, // Soft Lavender Indigo
    { x: 0.85, y: 0.25, r: 0.35, speed: 0.8,  color: '#FBBF24', phase: 3.6 }, // Soft Amber
    { x: 0.15, y: 0.80, r: 0.38, speed: 1.0,  color: '#34D399', phase: 4.8 }, // Mint Teal
    { x: 0.62, y: 0.85, r: 0.34, speed: 1.15, color: '#C084FC', phase: 6.0 }, // Soft Purple
  ];

  let mouse = { x: 0.5, y: 0.5 };
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX / window.innerWidth;
    mouse.y = e.clientY / window.innerHeight;
  });

  let t = 0;
  function draw() {
    t++;

    ctx.fillStyle = '#F8FAFC';
    ctx.fillRect(0, 0, W, H);

    blobs.forEach((b, i) => {
      const mx = (mouse.x - 0.5) * 0.08 * b.speed;
      const my = (mouse.y - 0.5) * 0.07 * b.speed;
      const bx = (b.x + Math.sin(t * 0.004 * b.speed + b.phase) * 0.12 + mx) * W;
      const by = (b.y + Math.cos(t * 0.003 * b.speed + b.phase) * 0.10 + my) * H;
      const pulse = 1 + Math.sin(t * 0.015 * b.speed + b.phase) * 0.06;
      const br = b.r * Math.min(W, H) * pulse;

      const grad = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      grad.addColorStop(0,   hexAlpha(b.color, 0.40));
      grad.addColorStop(0.5, hexAlpha(b.color, 0.18));
      grad.addColorStop(1,   hexAlpha(b.color, 0.00));

      ctx.beginPath();
      drawBlob(ctx, bx, by, br, t * 0.010 * b.speed + b.phase);
      ctx.fillStyle = grad;
      ctx.fill();
    });

    // Soft Vignette for Light Mode
    const vig = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.85);
    vig.addColorStop(0, 'rgba(248,250,252,0)');
    vig.addColorStop(1, 'rgba(226,232,240,0.4)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(draw);
  }

  function drawBlob(ctx, cx, cy, r, phase) {
    const pts = 84;
    ctx.beginPath();
    for (let i = 0; i <= pts; i++) {
      const a = (i / pts) * Math.PI * 2;
      const d = r * (
        1
        + 0.22 * Math.sin(3 * a + phase)
        + 0.12 * Math.sin(5 * a - phase * 1.3)
        + 0.07 * Math.sin(7 * a + phase * 0.8)
      );
      if (i === 0) ctx.moveTo(cx + Math.cos(a)*d, cy + Math.sin(a)*d);
      else         ctx.lineTo(cx + Math.cos(a)*d, cy + Math.sin(a)*d);
    }
    ctx.closePath();
  }

  function hexAlpha(hex, alpha) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  draw();
</script>
